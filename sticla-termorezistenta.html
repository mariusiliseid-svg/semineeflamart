<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticlă termorezistentă la dimensiune – Flamart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#7e2a2c; --accent-dark:#5e1f21; --ink:#1d1d1f; --muted:#6b6b70;
    --line:#e3e3e6; --soft:#f5f5f6; --stage:#141414; --ok:#2f6b3a; --err:#a1262b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:var(--ink);font-family:Manrope,system-ui,sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:24px 16px 40px}
  .grid{display:grid;grid-template-columns:1.05fr 1fr;gap:32px;align-items:start}
  @media (max-width:820px){.grid{grid-template-columns:1fr;gap:20px}}
  .eyebrow{font-size:12px;letter-spacing:.02em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 6px}
  h1{font-size:clamp(24px,3.2vw,34px);line-height:1.15;margin:0 0 8px;font-weight:800}
  .lead{color:var(--muted);margin:0 0 22px;line-height:1.55;font-size:15px}

  .stage{--bg:#f6f4f1;background-color:var(--bg);background-image:radial-gradient(#e0dad3 1px,transparent 1.2px);background-size:16px 16px;border:1px solid #ebe7e2;border-radius:18px;aspect-ratio:1/0.92;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .box{position:relative;transform:translate(-10px,-10px)}
  .glass{position:absolute;left:0;top:0;border:2px solid #2a2a2d;border-radius:3px;overflow:hidden;
    background:radial-gradient(ellipse 90% 70% at 50% 108%,rgba(240,132,52,.55) 0%,rgba(126,42,44,.22) 45%,transparent 72%),linear-gradient(165deg,rgba(60,52,48,.06),rgba(60,52,48,.20));
    box-shadow:0 12px 26px rgba(40,30,25,.14),inset 0 0 0 3px rgba(255,255,255,.55);transition:width .25s ease,height .25s ease}
  .glass::after{content:"";position:absolute;inset:0;background:linear-gradient(118deg,transparent 28%,rgba(255,255,255,.45) 40%,transparent 52%,transparent 64%,rgba(255,255,255,.22) 70%,transparent 76%)}
  .dl{position:absolute;color:var(--accent)}
  .dl.w{left:0;height:0;border-top:1.5px solid currentColor}
  .dl.w::before,.dl.w::after{content:"";position:absolute;top:-6px;height:11px;border-left:1.5px solid currentColor}
  .dl.w::before{left:-1px}.dl.w::after{right:-1px}
  .dl.h{top:0;width:0;border-left:1.5px solid currentColor}
  .dl.h::before,.dl.h::after{content:"";position:absolute;left:-6px;width:11px;border-top:1.5px solid currentColor}
  .dl.h::before{top:-1px}.dl.h::after{bottom:-1px}
  .dl span{position:absolute;font-weight:700;font-size:13px;white-space:nowrap;background:var(--bg);padding:1px 6px;border-radius:4px}
  .dl.w span{left:50%;top:0;transform:translate(-50%,-50%)}
  .dl.h span{top:50%;left:0;transform:translate(-50%,-50%) rotate(-90deg)}

  .card{border:1px solid var(--line);border-radius:18px;padding:22px}
  .card h2{font-size:20px;margin:0 0 16px;font-weight:800}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  label{display:block;font-size:14px;font-weight:600;margin:0 0 7px}
  input[type=number]{width:100%;font:600 20px Manrope,sans-serif;padding:13px 16px;border:1.5px solid var(--line);border-radius:999px;outline:none;color:var(--ink);background:#fff;-moz-appearance:textfield}
  input[type=number]:focus{border-color:var(--accent)}
  input.bad{border-color:var(--err)}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .hint{display:inline-block;margin:12px 0 0;background:var(--soft);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--muted)}
  .msg{min-height:20px;font-size:13px;color:var(--err);margin:8px 2px 0}

  .buy{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
  .price small{display:block;font-size:12px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .price b{display:block;font-size:34px;line-height:1.1;font-weight:800}
  .price span{font-size:13px;color:var(--muted)}
  .qty{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;height:52px;margin-left:auto}
  .qty button{width:44px;height:100%;border:0;background:none;font-size:22px;color:var(--muted);cursor:pointer}
  .qty input{width:40px;border:0;text-align:center;font:700 18px Manrope,sans-serif;padding:0}
  .add{height:52px;padding:0 26px;border:0;border-radius:999px;background:var(--accent);color:#fff;font:700 16px Manrope,sans-serif;cursor:pointer;flex:1 1 180px}
  .add:hover{background:var(--accent-dark)}
  .add:disabled{opacity:.55;cursor:default}
  .status{margin-top:12px;font-size:14px;min-height:20px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted)}

  .details{margin-top:36px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media (max-width:820px){.details{grid-template-columns:1fr}}
  .details div{background:var(--soft);border-radius:16px;padding:18px}
  .details h3{margin:0 0 8px;font-size:15px}
  .details p,.details li{margin:0;font-size:14px;line-height:1.55;color:#444}
  .details ul{margin:0;padding-left:18px}

  /* Telefon: compact, forma lângă câmpuri, fără derulare în interior */
  html,body{overflow:hidden}
  @media (max-width:600px){
    .wrap{padding:12px 12px 16px}
    .grid{display:flex;flex-direction:column;align-items:stretch;gap:12px}
    .left{width:100%}
    .right{display:contents}
    .head{order:1}
    .left{order:2}
    .card{order:3}
    .eyebrow{font-size:10px;margin:0 0 3px}
    h1{font-size:19px;margin:0 0 4px}
    .lead{font-size:13px;line-height:1.45;margin:0}
    .stage{aspect-ratio:auto;height:190px;border-radius:12px}
    .dl span{font-size:11px;padding:0 4px}
    .box{transform:translate(-8px,-8px)}
    .card{padding:14px;border-radius:14px}
    .card h2{font-size:15px;margin:0 0 10px}
    .row{gap:10px}
    label{font-size:12px;margin:0 0 4px}
    input[type=number]{font-size:17px;padding:9px 14px}
    .hint{font-size:11px;padding:5px 10px;margin-top:8px}
    .msg{min-height:0;font-size:12px;margin-top:4px}
    .buy{gap:10px;margin-top:12px;padding-top:12px}
    .price small{font-size:10px}
    .price b{font-size:24px}
    .price span{font-size:11px}
    .qty{height:42px}
    .qty button{width:36px;font-size:19px}
    .qty input{width:36px;font-size:16px;text-align:center}
    .add{height:44px;font-size:15px;flex:1 1 100%}
    .status{font-size:12px;margin-top:8px;min-height:0}
    .meta{font-size:11px;gap:10px;margin-top:8px}
    .details{margin-top:16px;gap:10px}
    .details div{padding:12px 14px;border-radius:12px}
    .details h3{font-size:13px;margin-bottom:4px}
    .details p,.details li{font-size:12px;line-height:1.5}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="grid">
    <div class="left">
      <div class="stage" id="stage">
        <div class="box" id="box">
          <div class="glass" id="glass"></div>
          <div class="dl w" id="dlW"><span id="lblW"></span></div>
          <div class="dl h" id="dlH"><span id="lblH"></span></div>
        </div>
      </div>
    </div>

    <div class="right">

      <div class="card">
        <h2>Introdu dimensiunile sticlei</h2>
        <div class="row">
          <div>
            <label for="h">Înălțime (mm)</label>
            <input id="h" type="number" inputmode="numeric" min="100" max="1000" step="1" value="300">
          </div>
          <div>
            <label for="w">Lățime (mm)</label>
            <input id="w" type="number" inputmode="numeric" min="100" max="1000" step="1" value="300">
          </div>
        </div>
        <span class="hint">În mm! 1 cm = 10 mm · între 100 și 1000 mm</span>
        <div class="msg" id="msg"></div>

        <div class="buy">
          <div class="price">
            <small>Preț</small>
            <b id="price">135 lei</b>
            <span>TVA inclus</span>
          </div>
          <div class="qty">
            <button type="button" id="minus" aria-label="Scade cantitatea">−</button>
            <input id="qty" type="number" min="1" max="50" value="1" aria-label="Cantitate">
            <button type="button" id="plus" aria-label="Crește cantitatea">+</button>
          </div>
          <button class="add" id="add" type="button">Adaugă în coș</button>
        </div>
        <div class="meta"><span id="area">0,09 m²</span><span>1.499 lei/m²</span><span>Livrare prin curier</span></div>
        <div class="status" id="status" role="status"></div>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  var PRICE_M2 = 1499, MIN = 100, MAX = 1000;
  var $ = function(id){ return document.getElementById(id); };
  var hEl = $('h'), wEl = $('w'), qEl = $('qty');
  var embedded = window.parent && window.parent !== window;
  var busy = false;

  function fmt(n){ return n.toLocaleString('ro-RO'); }
  function val(el){ var v = parseInt(el.value, 10); return isNaN(v) ? null : v; }
  function ok(v){ return v !== null && v >= MIN && v <= MAX; }
  function priceOf(h, w){ return Math.round(h * w / 1e6 * PRICE_M2); }

  function draw(h, w){
    var stage = $('stage').getBoundingClientRect();
    var maxW = stage.width * 0.62, maxH = stage.height * 0.62;
    var hh = ok(h) ? h : 300, ww = ok(w) ? w : 300;
    var s = Math.min(maxW / ww, maxH / hh);
    var pw = Math.max(40, ww * s), ph = Math.max(40, hh * s);
    var box = $('box'), g = $('glass');
    box.style.width = pw + 'px'; box.style.height = ph + 'px';
    g.style.width = pw + 'px'; g.style.height = ph + 'px';
    $('lblW').textContent = (ok(w) ? w : '–') + ' mm';
    $('lblH').textContent = (ok(h) ? h : '–') + ' mm';
    $('dlW').style.top = (ph + 18) + 'px'; $('dlW').style.width = pw + 'px';
    $('dlH').style.left = (pw + 18) + 'px'; $('dlH').style.height = ph + 'px';
  }

  function update(){
    var h = val(hEl), w = val(wEl), q = Math.min(50, Math.max(1, val(qEl) || 1));
    var msgs = [];
    hEl.classList.toggle('bad', !ok(h)); wEl.classList.toggle('bad', !ok(w));
    if (!ok(h)) msgs.push('Înălțimea trebuie să fie între 100 și 1000 mm.');
    if (!ok(w)) msgs.push('Lățimea trebuie să fie între 100 și 1000 mm.');
    $('msg').textContent = msgs.join(' ');
    draw(h, w);
    if (ok(h) && ok(w)){
      var p = priceOf(h, w);
      $('price').textContent = fmt(p * q) + ' lei';
      $('area').textContent = (h * w / 1e6).toLocaleString('ro-RO', {maximumFractionDigits: 3}) + ' m²' + (q > 1 ? ' × ' + q + ' buc. (' + fmt(p) + ' lei/buc.)' : '');
      $('add').disabled = busy;
    } else {
      $('price').textContent = '– lei';
      $('area').textContent = '–';
      $('add').disabled = true;
    }
  }

  function setStatus(text, cls){ var s = $('status'); s.textContent = text; s.className = 'status' + (cls ? ' ' + cls : ''); }

  [hEl, wEl, qEl].forEach(function(el){ el.addEventListener('input', update); });
  $('minus').onclick = function(){ qEl.value = Math.max(1, (val(qEl) || 1) - 1); update(); };
  $('plus').onclick = function(){ qEl.value = Math.min(50, (val(qEl) || 1) + 1); update(); };
  window.addEventListener('resize', update);

  $('add').onclick = function(){
    var h = val(hEl), w = val(wEl), q = Math.min(50, Math.max(1, val(qEl) || 1));
    if (!ok(h) || !ok(w)) return;
    if (!embedded){
      setStatus('Comanda se plasează din pagina de pe flamart.ro.', 'err');
      return;
    }
    busy = true; $('add').disabled = true; $('add').textContent = 'Se adaugă…'; setStatus('');
    window.parent.postMessage({ type: 'flamart-sticla-add', h: h, w: w, qty: q }, '*');
    setTimeout(function(){ if (busy) done(false, 'Nu am primit răspuns. Încearcă din nou sau sună-ne.'); }, 15000);
  };

  function done(success, text){
    busy = false; $('add').textContent = 'Adaugă în coș'; update();
    setStatus(text, success ? 'ok' : 'err');
  }

  window.addEventListener('message', function(e){
    var d = e.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'flamart-sticla-ok') done(true, 'Am adăugat în coș: ' + d.qty + ' × ' + d.h + ' × ' + d.w + ' mm, ' + fmt(d.pret) + ' lei/buc.');
    if (d.type === 'flamart-sticla-err') done(false, d.message || 'Nu am putut adăuga în coș. Încearcă din nou sau sună-ne.');
  });

  update();
})();
</script>
</body>
</html>
