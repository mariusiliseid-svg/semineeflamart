<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alege forma focarului – Flamart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#16171a;--card:#1d1e22;--card-on:#232428;--line:#2c2d33;--accent:#7e2a2c;--accent-l:#c9787b;--txt:#fff;--muted:#9fa0a6}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Manrope,system-ui,sans-serif;overflow:hidden}
  .wrap{max-width:1100px;margin:0 auto;padding:22px 20px 18px}
  .q{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 14px}
  .q h2{margin:0;font-size:19px;font-weight:800}
  .q p{margin:0;font-size:13px;color:var(--muted)}
  .row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .row::-webkit-scrollbar{display:none}
  a.opt{flex:1 0 132px;position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 10px 13px;border-radius:6px;
    background:var(--card);border:1px solid var(--line);color:var(--txt);text-decoration:none;transition:border-color .15s,background .15s;overflow:hidden}
  a.opt:hover{border-color:#45464d}
  a.opt.on{background:var(--card-on);border-color:#5a2a2c}
  a.opt.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--accent)}
  a.opt b{font-size:14px;font-weight:700}
  a.opt span{font-size:11.5px;color:var(--muted);text-align:center}
  a.opt.on span{color:#d4d4d8}
  svg{display:block}
  a.opt svg{opacity:.62;transition:opacity .15s}
  a.opt:hover svg,a.opt.on svg{opacity:1}
  .desc{margin:12px 0 0;font-size:13.5px;color:#d6d6da;min-height:19px}
  .desc strong{color:var(--accent-l);font-weight:700}
  @media (max-width:600px){
    .wrap{padding:16px 12px 14px}
    .q h2{font-size:16px}
    .q p{display:none}
    a.opt{flex:0 0 112px;padding:11px 8px 11px}
    a.opt b{font-size:13px}
    a.opt span{font-size:10.5px}
    svg{width:72px;height:48px}
    .desc{font-size:12.5px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="q">
    <h2>Câte laturi de sticlă vrei să vezi?</h2>
    <p>Focarul văzut de sus: marginile deschise sunt sticla.</p>
  </div>
  <nav class="row" id="row" aria-label="Forma focarului"></nav>
  <p class="desc" id="desc"></p>
</div>
<script>
(function(){
  var SHAPES = [
    { id:'frontal', name:'Frontal', sub:'sticlă în față', g:{b:1}, url:'https://www.flamart.ro/semineu-cu-geam-drept',
      d:'Sticlă doar în față. Potrivit pentru un perete drept și cea mai simplă placare.' },
    { id:'colt', name:'Pe colț', sub:'față + o latură', g:{b:1,l:1}, url:'https://www.flamart.ro/semineu-cu-sticla-pe-colt',
      d:'Sticlă în față și pe o latură, stânga sau dreapta. Se montează în colțul camerei.' },
    { id:'trei', name:'Formă C', sub:'laterale scurte', g:{b:1,l:1,r:1}, box:[10,22,76,30], url:'https://www.flamart.ro/seminee-cu-sticl%C4%83-pe-3-laturi',
      d:'Sticlă în față și pe ambele laturi, cu laturile scurte. Focul se vede larg din față și din lateral.' },
    { id:'tunel', name:'Tunel', sub:'față + spate', g:{b:1,t:1}, url:'https://www.flamart.ro/semineu-tip-tunel',
      d:'Sticlă în față și în spate. Vezi focul din două camere deodată.' },
    { id:'u', name:'Formă U', sub:'laterale lungi', g:{b:1,l:1,r:1}, box:[24,6,48,52], url:'https://www.flamart.ro/seminee-cu-sticla-pe-3-laturi-tipu',
      d:'Sticlă în față și pe ambele laturi, cu laturile lungi. Focul se vede bine și din lateral.' }
  ];
  var params = new URLSearchParams(location.search);
  var active = params.get('activ') || '';
  var glow = getComputedStyle(document.documentElement).getPropertyValue('--glow').trim() || '#f29a52';
  var wall = '#5c5d64';

  var n = 0;
  function icon(s, on){
    var id = 'i' + (n++);
    var bx = s.box || [14,10,68,44], x1 = bx[0], y1 = bx[1], x2 = bx[0]+bx[2], y2 = bx[1]+bx[3];
    var cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
    // centrul jarului se apropie de laturile cu sticlă
    var gx = 50 + (s.g.l ? -8 : 0) + (s.g.r ? 8 : 0), gy = s.g.t ? 50 : 72;
    var side = function(k, xa, ya, xb, yb){
      if (s.g[k]) {
        var horiz = ya === yb, o = 1.6;
        return '<line x1="'+xa+'" y1="'+ya+'" x2="'+xb+'" y2="'+yb+'" stroke="#cfd8de" stroke-opacity=".14" stroke-width="10" stroke-linecap="square"/>' +
          '<line x1="'+xa+'" y1="'+ya+'" x2="'+xb+'" y2="'+yb+'" stroke="#c7d1d8" stroke-width="4" stroke-linecap="square"/>' +
          '<line x1="'+(horiz?xa+4:xa+(k==='l'?-o:o))+'" y1="'+(horiz?ya+(k==='t'?-o:o):ya+4)+'" x2="'+(horiz?xa+(xb-xa)*0.45:xb+(k==='l'?-o:o))+'" y2="'+(horiz?yb+(k==='t'?-o:o):ya+(yb-ya)*0.45)+'" stroke="#fff" stroke-opacity=".75" stroke-width="1" stroke-linecap="round"/>';
      }
      return '<line x1="'+xa+'" y1="'+ya+'" x2="'+xb+'" y2="'+yb+'" stroke="#3a3b41" stroke-width="6" stroke-linecap="square"/>';
    };
    return '<svg width="88" height="58" viewBox="0 0 96 64" fill="none" aria-hidden="true">' +
      '<defs>' +
        '<radialGradient id="'+id+'e" cx="'+gx+'%" cy="'+gy+'%" r="65%">' +
          '<stop offset="0" stop-color="#f08434" stop-opacity="'+(on?'.85':'.6')+'"/>' +
          '<stop offset=".45" stop-color="#7e2a2c" stop-opacity=".45"/>' +
          '<stop offset="1" stop-color="#26262a" stop-opacity="0"/>' +
        '</radialGradient>' +
        '<linearGradient id="'+id+'g" x1="0" y1="0" x2="1" y2="1">' +
          '<stop offset="0" stop-color="#e9eef2"/><stop offset=".5" stop-color="#aeb9c2"/><stop offset="1" stop-color="#dfe6eb"/>' +
        '</linearGradient>' +
      '</defs>' +
      '<rect x="'+x1+'" y="'+y1+'" width="'+(x2-x1)+'" height="'+(y2-y1)+'" fill="#202024"/>' +
      '<rect x="'+x1+'" y="'+y1+'" width="'+(x2-x1)+'" height="'+(y2-y1)+'" fill="url(#'+id+'e)"/>' +
      side('t', x1, y1, x2, y1) + side('b', x1, y2, x2, y2) +
      side('l', x1, y1, x1, y2) + side('r', x2, y1, x2, y2) +
      '</svg>';
  }

  var row = document.getElementById('row'), desc = document.getElementById('desc'), activeEl = null;

  SHAPES.forEach(function(s){
    var on = s.id === active;
    var a = document.createElement('a');
    a.className = 'opt' + (on ? ' on' : '');
    a.href = s.url; a.target = '_top';
    if (on) a.setAttribute('aria-current', 'page');
    a.innerHTML = icon(s, on) + '<b>' + s.name + '</b><span>' + s.sub + '</span>';
    a.addEventListener('mouseenter', function(){ desc.innerHTML = '<strong>' + s.name + ':</strong> ' + s.d; });
    a.addEventListener('mouseleave', show);
    row.appendChild(a);
    if (on) activeEl = a;
  });
  function center(){
    if (!activeEl) return;
    var x = activeEl.offsetLeft - row.offsetLeft - (row.clientWidth - activeEl.offsetWidth) / 2;
    row.scrollLeft = Math.max(0, x);
  }
  setTimeout(center, 50);
  window.addEventListener('resize', center);
  function show(){
    var s = SHAPES.filter(function(x){ return x.id === active; })[0];
    desc.innerHTML = s ? '<strong>' + s.name + ':</strong> ' + s.d : 'Alege o formă ca să vezi focarele potrivite.';
  }
  show();
})();
</script>
</body>
</html>
