<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Semnare contract · BOKAR România</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{ --ink:#232324; --stone:#68686a; --line:rgba(35,35,36,.14); --bg-soft:#f6f4f1; --blue:#1a5490; --red:#c0392b; --green:#1e6b39; --green-bg:#e9f7ee; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg-soft);color:var(--ink);font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased;}
  header{background:var(--ink);color:#fff;padding:14px 16px;font-weight:800;letter-spacing:.08em;font-size:14px;}
  header small{display:block;font-weight:500;letter-spacing:0;color:#ccc;font-size:12px;margin-top:2px;}
  main{max-width:820px;margin:0 auto;padding:16px;}
  .box{background:#fff;border-radius:10px;padding:16px;margin:14px 0;border:1px solid var(--line);}
  .box h2{margin:0 0 6px;font-size:16px;}
  .msg{background:#fff;border-radius:10px;padding:22px 16px;text-align:center;border:1px solid var(--line);margin-top:20px;line-height:1.5;}
  label{display:block;font-size:12px;font-weight:700;color:var(--stone);margin:12px 0 5px;}
  input[type=text]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;}
  .pad{width:100%;height:180px;border:1.5px dashed var(--blue);border-radius:8px;background:#fff;touch-action:none;display:block;}
  .chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin-top:14px;}
  .chk input{width:20px;height:20px;flex:none;margin-top:1px;}
  .btn{display:inline-block;border:none;border-radius:6px;font:inherit;font-weight:700;font-size:14px;padding:12px 16px;cursor:pointer;text-align:center;}
  .btn-p{background:var(--red);color:#fff;width:100%;margin-top:14px;}
  .btn-s{background:#fff;color:var(--ink);border:1px solid var(--line);width:100%;margin-bottom:14px;}
  .btn:disabled{opacity:.5;}
  .err{color:var(--red);font-size:13px;font-weight:600;margin-top:10px;min-height:1em;}
  .ok{background:var(--green-bg);color:var(--green);border-radius:10px;padding:14px 16px;font-weight:600;margin:14px 0;}
  .clr{color:var(--blue);cursor:pointer;font-weight:600;}
  .docwrap{overflow-x:auto;}
  .ov{position:fixed;inset:0;background:rgba(20,20,20,.55);display:none;place-items:center;color:#fff;font-weight:700;z-index:99;padding:16px;}

  /* documentul contractului (aceleași clase ca în portal) */
  .cdoc{background:#fff;color:#18202c;font-family:'Source Serif 4',Georgia,'Times New Roman',serif;font-size:12.6px;line-height:1.5;max-width:760px;margin:0 auto;padding:30px 34px;border-radius:4px;box-shadow:0 1px 2px rgba(10,30,60,.08),0 10px 30px rgba(10,30,60,.10);}
  .cdoc.pdf{width:688px;max-width:none;padding:0;box-shadow:none;border-radius:0;}
  .cdoc .dh{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:12px;border-bottom:3px solid #173f7a;}
  .cdoc .dh .logo img{max-height:52px;max-width:180px;display:block;}
  .cdoc .wm{font-family:'Manrope',sans-serif;font-weight:800;font-size:22px;letter-spacing:.14em;color:#173f7a;line-height:1;}
  .cdoc .wm small{display:block;font-weight:600;font-size:9px;letter-spacing:.24em;color:#5d6b80;margin-top:4px;}
  .cdoc .firm{text-align:right;font-family:'Manrope',sans-serif;font-size:10px;color:#4a5668;line-height:1.45;}
  .cdoc .firm b{color:#18202c;font-size:11px;}
  .cdoc .dtitle{text-align:center;margin:20px 0 4px;}
  .cdoc .dtitle h2{font-family:'Manrope',sans-serif;font-size:19px;letter-spacing:.12em;margin:0;color:#173f7a;font-weight:800;}
  .cdoc .dtitle p{margin:3px 0 0;font-size:12.5px;color:#4a5668;font-style:italic;}
  .cdoc .dmeta{display:flex;justify-content:center;gap:8px;margin:10px 0 16px;font-family:'Manrope',sans-serif;font-size:11px;}
  .cdoc .dmeta span{background:#eaf0f9;color:#173f7a;padding:4px 10px;border-radius:99px;font-weight:700;}
  .cdoc .keys{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #c9d5e6;border-radius:6px;margin-bottom:16px;font-family:'Manrope',sans-serif;}
  .cdoc .keys div{padding:7px 10px;border-left:1px solid #c9d5e6;}
  .cdoc .keys div:first-child{border-left:0;}
  .cdoc .keys span{display:block;font-size:8.5px;text-transform:uppercase;letter-spacing:.08em;color:#5d6b80;}
  .cdoc .keys b{font-size:12px;color:#18202c;font-variant-numeric:tabular-nums;}
  .cdoc .parties{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
  .cdoc .party{border:1px solid #c9d5e6;border-radius:6px;padding:9px 11px;font-size:11.4px;line-height:1.5;}
  .cdoc .party h4,.cdoc .sig h4{margin:0 0 4px;font-family:'Manrope',sans-serif;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#2a62b5;}
  .cdoc .party .n{font-weight:700;font-size:12.5px;margin-bottom:2px;}
  .cdoc h3{font-family:'Manrope',sans-serif;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#173f7a;margin:16px 0 6px;padding-bottom:3px;border-bottom:1px solid #d7e0ec;}
  .cdoc p{margin:0 0 6px;text-align:justify;}
  .cdoc p .a{font-family:'Manrope',sans-serif;font-weight:700;color:#2a62b5;font-size:11px;margin-right:3px;}
  .cdoc table{width:100%;border-collapse:collapse;font-size:11.4px;margin:6px 0 10px;font-variant-numeric:tabular-nums;}
  .cdoc th{background:#173f7a;color:#fff;font-family:'Manrope',sans-serif;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding:6px 7px;text-align:left;border:0;}
  .cdoc td{padding:6px 7px;border-bottom:1px solid #d7e0ec;}
  .cdoc tr:nth-child(even) td{background:#f5f8fc;}
  .cdoc .r{text-align:right;}
  .cdoc tfoot td{font-weight:700;border-bottom:2px solid #173f7a;background:#fff!important;}
  .cdoc .blank{background:#fff4d1;padding:0 4px;border-radius:2px;color:#8a6a10;}
  .cdoc .signs{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px;}
  .cdoc .sig{border:1px solid #c9d5e6;border-radius:6px;padding:10px 12px;font-size:11.2px;min-height:140px;display:flex;flex-direction:column;}
  .cdoc .sig .im{flex:1;display:flex;align-items:center;justify-content:center;min-height:70px;border-bottom:1px solid #9aabc4;margin:6px 0 5px;}
  .cdoc .sig .im img{max-height:70px;max-width:100%;}
  .cdoc .sig .when{font-size:9.5px;color:#5d6b80;font-family:'Manrope',sans-serif;}
  .cdoc .dfoot{margin-top:16px;padding-top:8px;border-top:1px solid #d7e0ec;font-family:'Manrope',sans-serif;font-size:9px;color:#7a8698;text-align:center;}
  @media (max-width:650px){
    .cdoc:not(.pdf){padding:18px 14px;font-size:12px;}
    .cdoc:not(.pdf) .keys{grid-template-columns:1fr 1fr;}
    .cdoc:not(.pdf) .parties,.cdoc:not(.pdf) .signs{grid-template-columns:1fr;}
    .cdoc:not(.pdf) .dh{flex-direction:column;align-items:flex-start;}
    .cdoc:not(.pdf) .firm{text-align:left;}
  }
</style>
</head>
<body>
<header>BOKAR ROMÂNIA · FLAMART<small>Semnare electronică de contract</small></header>
<main id="app"><div class="msg">Se încarcă contractul…</div></main>
<div class="ov" id="ov"></div>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyC8lON_PQ9OIvnDUqzqRDHsxXINLpC8uB4",
  authDomain: "bokar-crm.firebaseapp.com",
  projectId: "bokar-crm",
  storageBucket: "bokar-crm.firebasestorage.app",
  messagingSenderId: "45902513565",
  appId: "1:45902513565:web:1d2c55629af5d23e0d9b74"
});
const db = firebase.firestore();
const app = document.getElementById('app');
const tok = new URLSearchParams(location.search).get('s') || '';
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const tsDate = t => t && typeof t.toDate==='function' ? t.toDate() : (t ? new Date(t) : null);
const whenTxt = d => `${d.toLocaleDateString('ro-RO')}, ora ${d.toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'})}`;
function fill(html, sig, txt){
  return html.replace('<!--SIGDZ-->', sig ? `<img src="${sig}" alt="Semnătura">` : '')
             .replace(/<!--SIGDZTXT-->[\s\S]*?<!--\/SIGDZTXT-->/, txt);
}
let D = null;

async function start(){
  if(!tok){ app.innerHTML = '<div class="msg">Linkul nu este complet. Deschide-l din nou din mesajul primit.</div>'; return; }
  try{
    const snap = await db.collection('semnari').doc(tok).get();
    if(!snap.exists){ app.innerHTML = '<div class="msg"><b>Linkul nu mai este valabil.</b><br>A fost retras sau contractul a fost modificat. Cere un link nou de la Flamart.</div>'; return; }
    D = snap.data();
  }catch(e){ console.error(e); app.innerHTML = '<div class="msg">Contractul nu s-a putut încărca. Verifică internetul și reîncarcă pagina.</div>'; return; }
  if(D.status==='semnat') return showSigned(false);
  const exp = tsDate(D.expira);
  if(exp && exp < new Date()){ app.innerHTML = '<div class="msg"><b>Linkul a expirat.</b><br>Cere un link nou de la Flamart.</div>'; return; }
  const c = D.contract || {}, dz = c.dz || {};
  app.innerHTML = `
    <div class="box"><h2>Contract ${esc(c.nr||'')}</h2>
      <div style="font-size:13.5px;color:var(--stone)">Citește contractul de mai jos, apoi semnează la final. După semnare, poți descărca PDF-ul.</div></div>
    <div class="docwrap"><article class="cdoc">${fill(D.docHtml||'', '', 'Nesemnat')}</article></div>
    <div class="box"><h2>Semnătura ta</h2>
      <label>Numele celui care semnează</label><input type="text" id="nm" value="${esc(dz.rep||'')}" autocomplete="name">
      <label>Semnează în chenar · <span class="clr" id="clr">șterge</span></label><canvas class="pad" id="pad"></canvas>
      <div class="chk"><input type="checkbox" id="ag"><span>Am citit contractul și sunt de acord cu el, în numele ${esc(dz.firma||'firmei')}.</span></div>
      <button class="btn btn-p" id="go" type="button">Semnez contractul</button>
      <div class="err" id="err"></div></div>`;
  const pad = makePad(document.getElementById('pad'));
  document.getElementById('clr').onclick = () => pad.clear();
  document.getElementById('go').onclick = async () => {
    const nm = document.getElementById('nm').value.trim(), err = document.getElementById('err');
    if(!nm){ err.textContent = 'Scrie numele celui care semnează.'; return; }
    if(!pad.dirty){ err.textContent = 'Semnează în chenar.'; return; }
    if(!document.getElementById('ag').checked){ err.textContent = 'Bifează că ești de acord cu contractul.'; return; }
    err.textContent = ''; const b = document.getElementById('go'); b.disabled = true; b.textContent = 'Se salvează…';
    const sig = pad.png();
    try{
      await db.collection('semnari').doc(tok).update({ status:'semnat', sigDz:sig, semnatar:nm,
        dispozitiv:navigator.userAgent.slice(0,200), semnatLa:firebase.firestore.FieldValue.serverTimestamp() });
      Object.assign(D, { status:'semnat', sigDz:sig, semnatar:nm, semnatLa:new Date() });
      showSigned(true);
    }catch(e){ console.error(e); b.disabled = false; b.textContent = 'Încearcă din nou';
      err.textContent = 'Semnătura nu s-a putut salva. Verifică internetul și încearcă din nou; dacă problema persistă, anunță Flamart.'; }
  };
}
function showSigned(justNow){
  const c = D.contract || {}, d = tsDate(D.semnatLa) || new Date();
  const html = fill(D.docHtml||'', D.sigDz, `Semnat de ${esc(D.semnatar)} la ${whenTxt(d)}, prin link unic de semnare`);
  app.innerHTML = `
    <div class="ok">${justNow ? 'Mulțumim! Contractul a fost semnat.' : 'Contractul este deja semnat.'} Flamart primește automat semnătura.</div>
    <button class="btn btn-s" id="pdf" type="button">Descarcă PDF-ul</button>
    <div class="docwrap"><article class="cdoc">${html}</article></div>`;
  document.getElementById('pdf').onclick = () => makePdf(html, `Contract-${c.nr||'semnat'}.pdf`, c.nr||'');
}
function makePad(canvas){
  const ctx = canvas.getContext('2d'); let down = false, last = null;
  const P = { dirty:false,
    size(){ const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio||1; canvas.width = r.width*dpr; canvas.height = r.height*dpr;
      ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineWidth = 2.3; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0f2a55'; },
    clear(){ ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,canvas.width,canvas.height); P.dirty = false; P.size(); },
    png(){ return canvas.toDataURL('image/png'); } };
  const pt = e => { const r = canvas.getBoundingClientRect(); return { x:e.clientX-r.left, y:e.clientY-r.top }; };
  canvas.onpointerdown = e => { down = true; last = pt(e); canvas.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last.x,last.y,1.1,0,7); ctx.fillStyle = '#0f2a55'; ctx.fill(); P.dirty = true; };
  canvas.onpointermove = e => { if(!down) return; const p = pt(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last = p; };
  canvas.onpointerup = canvas.onpointercancel = () => { down = false; };
  P.size(); return P;
}
async function makePdf(html, name, nr){
  if(!window.jspdf || !window.html2canvas){ alert('Generatorul PDF nu s-a încărcat. Reîncarcă pagina.'); return; }
  const ov = document.getElementById('ov'); ov.textContent = 'Se generează PDF-ul…'; ov.style.display = 'grid';
  const W = 688, MM = { l:14, r:14, t:12, b:16 }, PH = Math.floor(W*(297-MM.t-MM.b)/(210-MM.l-MM.r));
  const host = document.createElement('div'); host.style.cssText = `position:fixed;left:-10000px;top:0;width:${W}px`;
  const src = document.createElement('article'); src.className = 'cdoc pdf'; src.innerHTML = html; host.appendChild(src); document.body.appendChild(host);
  try{
    try{ if(document.fonts && document.fonts.ready) await document.fonts.ready; }catch(e){}
    await Promise.all([...src.querySelectorAll('img')].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
    const blocks = [...src.children], n = blocks.length, tops = blocks.map(b => b.offsetTop), total = src.scrollHeight;
    const hs = blocks.map((b,i) => (i<n-1 ? tops[i+1] : total) - tops[i]);
    const pages = []; let cur = [], used = 0;
    for(let i=0;i<n;i++){ const keep = (blocks[i].tagName==='H3' && i<n-1) ? hs[i]+hs[i+1] : hs[i];
      if(used>0 && used+keep>PH){ pages.push(cur); cur = []; used = 0; } cur.push(i); used += hs[i]; }
    if(cur.length) pages.push(cur);
    const pdf = new window.jspdf.jsPDF({ unit:'mm', format:'a4' }), cw = 210-MM.l-MM.r, ch = 297-MM.t-MM.b;
    for(let p=0;p<pages.length;p++){
      const box = document.createElement('article'); box.className = 'cdoc pdf';
      pages[p].forEach(i => box.appendChild(blocks[i].cloneNode(true))); if(box.firstElementChild) box.firstElementChild.style.marginTop = '0';
      host.appendChild(box);
      const cv = await window.html2canvas(box, { scale:2, backgroundColor:'#ffffff', windowWidth:1024, logging:false });
      let w = cw, h = cv.height/cv.width*cw; if(h>ch){ h = ch; w = ch*cv.width/cv.height; }
      if(p>0) pdf.addPage(); pdf.addImage(cv.toDataURL('image/jpeg',0.92), 'JPEG', MM.l+(cw-w)/2, MM.t, w, h); box.remove();
    }
    const N = pdf.internal.getNumberOfPages(); pdf.setFontSize(8); pdf.setTextColor(120,134,152);
    for(let i=1;i<=N;i++){ pdf.setPage(i); pdf.text(`Contract ${nr}  -  pagina ${i} din ${N}`, 105, 291, { align:'center' }); }
    const blob = pdf.output('blob'), file = new File([blob], name, { type:'application/pdf' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){ try{ await navigator.share({ files:[file], title:name }); }catch(e){} }
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
  }catch(e){ console.error(e); alert('PDF-ul nu a putut fi generat. Încearcă din nou.'); }
  finally{ host.remove(); ov.style.display = 'none'; }
}
start();
</script>
</body>
</html>
